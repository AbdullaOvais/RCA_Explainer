### 1. **Memory Usage (%)**

   - **Problematic**: High memory usage can cause instability or crashes if critical processes are unable to allocate the required resources.

### 2. **CPU Utilization Rate (%)**
   - **Definition**: Percentage of CPU time that is actively being used (as opposed to waiting for tasks).

     - If CPU utilization consistently exceeds 100%, it suggests that the system is overwhelmed and tasks are queuing up.

   - **Problematic**: Prolonged high CPU utilization can lead to performance bottlenecks or even system crashes under heavy load.

   - **Problematic**: High disk wait times reduce overall system performance and can cause timeouts in latency-sensitive applications.
