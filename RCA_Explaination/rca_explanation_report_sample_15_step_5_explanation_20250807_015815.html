### **1. CPU Usage (e.g., `sum(irate(container_cpu_user_seconds_total{name="srsdu2"}[5m])) by (instance) / sum(machine_cpu_cores{instance}) by (instance)`)**

#### **What the metric means**
This metric measures the percentage of CPU usage relative to the total available CPU cores on the host machine. It provides insight into how much of the CPU resources are being utilized by a specific container (`srsdu2` in this case) over a 5-minute interval.

#### **Why an anomaly is problematic**
- Excessive CPU usage (e.g., consistently high or spiking values) can indicate resource contention, where one container monopolizes CPU resources, starving others.
- Sustained high CPU usage can degrade performance for latency-sensitive applications, such as those running in real-time environments like 5G DU/CU setups.

#### **How it affects the system**
- High CPU usage can lead to increased latencies in processing tasks, delayed packet handling, and potential service disruptions.
- In a containerized environment with shared resources, high CPU usage by one container can degrade performance for others, especially if resource limits are not properly enforced.

#### **Suggested mitigation strategies**
1. **Apply CPU resource limits**: Use Docker's `--cpus` or Kubernetes' CPU limits to cap CPU usage per container.
2. **Optimize workloads**: Identify and optimize CPU-intensive tasks within containers to reduce unnecessary load.
3. **Monitor and alert**: Implement monitoring tools (e.g., Prometheus, Grafana) to track CPU usage and set alerts for thresholds that could indicate stress or failure.

---

### **2. Network Traffic (`sum(irate(container_network_receive_bytes_total{name="srsdu2"}[5m])) by (instance)`)**

#### **What the metric means**
This metric measures the rate of network traffic received by a container (`srsdu2` in this case) over a 5-minute interval, expressed in bytes per second. It reflects the volume of data being processed by the container.

#### **Why an anomaly is problematic**
- Sudden spikes or sustained high levels of network traffic can indicate overloaded network interfaces, leading to bottlenecks and increased latency.
- In a distributed system like a 5G DU/CU setup, excessive network traffic can disrupt communication between containers (e.g., `srscu` and `srsdu`), causing packet loss or delays.

#### **How it affects the system**
- High network traffic can overwhelm the Docker overlay network or host's physical interfaces, leading to latency spikes or dropped packets.
- In a containerized environment, network bottlenecks can propagate across services, impacting overall system performance.

#### **Suggested mitigation strategies**
1. **Optimize network configurations**: Use high-performance networking solutions like `macvlan` or `ipvlan` instead of the default `bridge` mode in Docker.
2. **Implement QoS policies**: Apply traffic shaping (e.g., using `tc` tools) to prioritize critical traffic and prevent overload.
3. **Scale horizontally**: Distribute workloads across multiple containers or hosts to balance network load.

---

### **3. Packet Loss (`packet_loss_rate`)**

#### **What the metric means**
This metric measures the percentage of packets lost during transmission over a network connection, typically between containers (e.g., `srscu` and `srsdu`). It reflects network stability and reliability.

#### **Why an anomaly is problematic**
- Packet loss can indicate issues such as network congestion, misconfigured QoS policies, or hardware failures.
- In real-time applications like 5G networks, packet loss can lead to performance degradation (e.g., increased latency, jitter) or even service interruptions.

#### **How it affects the system**
- Packet loss disrupts communication between containers, leading to retransmissions and increased latency.
- Persistent packet loss can degrade overall system reliability, impacting user experience and operational efficiency.

#### **Suggested mitigation strategies**
1. **Tune network parameters**: Increase buffer sizes (e.g., `net.ipv4.tcp_wmem`) or adjust congestion control algorithms (e.g., `bbr`).
2. **Implement redundancy**: Use multiple network interfaces or paths to ensure failover in case of packet loss.
3. **Monitor and troubleshoot**: Identify the root cause of packet loss using tools like `ping`, `traceroute`, or `tcpdump`.

---

### **4. Memory Usage (`sum(irate(container_memory_usage_bytes{name="srsdu2"}[5m])) by (instance)`)**

#### **What the metric means**
This metric measures the memory usage of a container (`srsdu2` in this case) over a 5-minute interval, expressed in bytes. It reflects how much memory is being consumed by the container.

#### **Why an anomaly is problematic**
- High memory usage can lead to increased garbage collection overhead, slower performance, or even out-of-memory (OOM) errors.
- In a shared environment like Docker, excessive memory usage by one container can starve others of resources, causing instability.

#### **How it affects the system**
- Memory-intensive containers can degrade overall system performance by forcing other containers to compete for limited resources.
- OOM conditions can cause unexpected restarts or failures, disrupting critical services.

#### **Suggested mitigation strategies**
1. **Set memory limits**: Use Docker's `--memory` or Kubernetes' memory limits to prevent containers from consuming excessive amounts of memory.
2. **Optimize applications**: Identify and reduce memory-intensive processes within containers.
3. **Monitor memory usage**: Continuously track memory consumption using tools like Prometheus and Grafana.

#### **Why an anomaly is problematic**
- High overall CPU usage can indicate that the system is approaching or exceeding its capacity, leading to potential bottlenecks.
- Sustained high usage can degrade performance for latency-sensitive applications and cause service disruptions.

#### **How it affects the system**
- Excessive CPU usage across containers can lead to resource contention, increased latencies, and degraded performance for critical services.
- In a containerized environment with shared resources, this can create cascading failures if one component fails due to lack of resources.

#### **Suggested mitigation strategies**
1. **Optimize resource allocation**: Review and adjust CPU and memory limits for containers based on their workloads.
2. **Scale horizontally or vertically**: Add more containers or increase the capacity of existing ones to handle increased load.
3. **Implement monitoring and alerts**: Continuously track system performance and set thresholds to proactively address issues.
