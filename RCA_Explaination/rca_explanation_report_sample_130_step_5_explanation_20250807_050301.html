### Feature 1: `dl_bitrate` (Downlink Bitrate)

#### 1. What the metric means
The `dl_bitrate` metric represents the rate at which data is being transmitted from the CU (Central Unit) to the DU (Distributed Unit) in a downlink direction. It is a measure of how much data can be reliably sent per unit time, typically measured in bits per second (bps).

#### 2. Why an anomaly is problematic
An anomaly in `dl_bitrate` could indicate that the downlink transmission is either too slow or unstable. A consistently low bitrate may suggest issues such as network congestion, interference, or insufficient resource allocation for data transmission. Conversely, a very high bitrate might not always be sustainable and could lead to packet loss or latency.

#### 3. How it affects the system
- **Low Bitrate**: Results in slower data delivery, impacting user experience (e.g., buffering in video streaming).
- **High Bitrate Fluctuations**: Can cause instability in network performance, leading to jitter or packet reordering.
- **Interdependencies**: Low bitrate can be caused by high CPU usage in the CU/DU containers, which may struggle to process data due to resource contention.

#### 4. Suggested mitigation strategies
- Optimize resource allocation for CU and DU containers (e.g., increase CPU shares or cores if possible).
- Adjust QoS settings on the network to prioritize critical traffic.
- Fine-tune the scheduler in the networking stack to ensure fair resource distribution.

---

### Feature 2: `dl_nof` (Downlink Number of OFDM Symbols per Slot)

#### 1. What the metric means
The `dl_nof` metric represents the number of Orthogonal Frequency Division Multiplexing (OFDM) symbols allocated for downlink data transmission in each slot. This is a measure of resource allocation efficiency.

#### 2. Why an anomaly is problematic
An anomaly in `dl_nof` could indicate that the network is either under-allocating or over-allocating resources for downlink transmissions. A consistently low number of OFDM symbols may result in insufficient capacity, while an unusually high number may lead to resource wastage and potential interference.

#### 3. How it affects the system
- **Low dl_nof**: Results in reduced capacity for downlink data transmission, leading to slower data rates.
- **High dl_nof**: May cause resource contention or latency if too many symbols are allocated without sufficient demand.
- **Interdependencies**: Fluctuations in `dl_nof` can be caused by CPU usage spikes in CU/DU containers, which may struggle to manage OFDM symbol allocation under stress.

#### 4. Suggested mitigation strategies
- Adjust the resource allocation algorithm to better match network demand.
- Optimize CPU resources for CU and DU containers to ensure they can handle OFDM symbol allocation efficiently.
- Monitor and adjust QoS policies to prevent over-allocation or under-allocation of resources.

---

### Feature 3: `dl_pucch_sinr` (Downlink PUCCH SINR)

#### 1. What the metric means
The `dl_pucch_sinr` metric represents the Signal-to-Interference-plus-Noise Ratio (SINR) for the Physical Uplink Control Channel (PUCCH) in the downlink direction. It measures the quality of the uplink control channel, which is critical for communication between the CU and DU.

#### 2. Why an anomaly is problematic
A low SINR value indicates poor signal quality, which can lead to errors or retransmissions. Conversely, a very high SINR may not always be possible due to hardware limitations or interference from other sources.

#### 3. How it affects the system
- **Low SINR**: Results in unreliable communication between CU and DU, leading to increased packet loss or retransmissions.
- **High SINR Fluctuations**: Can cause instability in network performance, impacting overall throughput and latency.
- **Interdependencies**: Low SINR can be exacerbated by high CPU usage in containers, which may lead to delayed processing of control signals.

#### 4. Suggested mitigation strategies
- Optimize the physical layer configuration (e.g., adjust modulation and coding schemes).
- Improve network coverage or reduce interference sources.
- Ensure sufficient CPU resources for CU/DU containers to handle PUCCH signaling efficiently.

#### 1. What the metric means
The `cpu_usage_percent` metric represents the percentage of CPU utilization in a container, indicating how much of the allocated CPU resources are being used by the application running in that container.

#### 2. Why an anomaly is problematic
An anomaly in `cpu_usage_percent` could indicate either underutilization or overutilization of CPU resources. High CPU usage can lead to resource contention and degraded performance, while low usage may suggest underutilized capacity.

#### 3. How it affects the system
- **High CPU Usage**: Results in increased latency, packet loss, or reduced throughput due to resource bottlenecks.
- **Low CPU Usage**: May indicate underutilization of resources, which could be optimized for better performance or cost efficiency.
- **Interdependencies**: High CPU usage in CU/DU containers can directly impact `dl_bitrate`, `dl_nof`, and `dl_pucch_sinr` by reducing the availability of resources for critical tasks.

#### 4. Suggested mitigation strategies
- Optimize resource allocation (e.g., increase CPU shares or cores for overloaded containers).
- Scale horizontally by adding more instances of the containerized application.
- Fine-tune application performance to reduce unnecessary CPU usage.

### Feature 5: `packet_loss_percent` (Packet Loss Percentage)

#### 1. What the metric means
The `packet_loss_percent` metric represents the percentage of packets that fail to reach their destination over a given period, indicating network reliability and throughput efficiency.

#### 2. Why an anomaly is problematic
A high packet loss percentage indicates poor network performance, which can lead to degraded user experience (e.g., buffering, retransmissions, or increased latency). Persistent packet loss may also indicate underlying issues such as congestion, interference, or resource contention.

#### 3. How it affects the system
- **High Packet Loss**: Results in slower data transfer rates and increased latency.
- **Interdependencies**: Packet loss can be caused by high CPU usage in containers (resource bottlenecks) or poor SINR values (unreliable communication).

#### 4. Suggested mitigation strategies
- Optimize network configuration to reduce congestion or interference.
- Increase network capacity (e.g., higher bandwidth or more resources allocated to critical paths).
- Ensure sufficient CPU resources for CU/DU containers to handle packet processing efficiently.

The metrics are interconnected, with high CPU usage in CU/DU containers potentially causing cascading effects on `dl_bitrate`, `dl_nof`, `dl_pucch_sinr`, and `packet_loss_percent`. To address these issues comprehensively:

1. **Optimize Resource Allocation**: Ensure that CU and DU containers have sufficient CPU resources to handle their respective tasks without bottlenecks.
2. **Improve Network Configuration**: Adjust physical layer configurations, QoS policies, and network coverage to reduce interference and improve SINR values.
3. **Monitor and Scale**: Continuously monitor resource usage and scale horizontally or vertically as needed to maintain optimal performance.

By addressing these factors holistically, you can ensure reliable communication between CU/DU containers and deliver a high-quality experience for end-users.
