### 1. **CPU Usage**

#### What the metric means:
- The `cpu usage` metric measures the percentage of CPU resources being utilized by a container or process over a given period of time.

#### Why an anomaly is problematic:
- High CPU usage can indicate that the system is under heavy load, which can lead to performance degradation, task delays, or even system unresponsiveness if the CPU becomes a bottleneck.

#### How it affects the system:
- Excessive CPU usage can cause delays in processing tasks, leading to increased latency for real-time applications like SRS (Scheduling and Resource Scheduling). This can result in packet loss, degraded network performance, or poor user experience.
- In the context of the setup, high CPU usage in containers such as `srscu` or `srsdu` could disrupt their ability to process radio interface data efficiently, leading to communication issues.

#### Suggested mitigation strategies:
- Optimize the workload distribution across containers to ensure that no single container is overloaded.
- Use CPU resource limits and guarantees (e.g., `--cpus` in Docker) to prevent any container from monopolizing the CPU.
- Monitor and adjust the number of active threads or processes running within a container to reduce unnecessary overhead.
- Consider upgrading hardware if the workload consistently exceeds available CPU resources.

### 2. **Memory Usage**

#### What the metric means:
- The `memory usage` metric indicates the amount of RAM being consumed by a container or process at any given time.

#### Why an anomaly is problematic:
- High memory usage can lead to memory contention, swapping, or even out-of-memory (OOM) errors if the system runs out of available memory. These issues can cause instability in the system and disrupt critical processes.

#### How it affects the system:
- Memory-intensive tasks within containers like `srscu` or `srsdu` can lead to increased latency or packet loss, especially during peak load conditions.
- In extreme cases, OOM errors can cause container restarts or crashes, leading to service disruptions and potential data loss.

#### Suggested mitigation strategies:
- Set memory limits for containers using Docker options like `--memory` to prevent them from consuming excessive amounts of RAM.
- Use memory monitoring tools (e.g., `docker stats`) to identify memory-intensive processes and optimize their resource usage.
- Regularly analyze the memory footprint of applications running within containers and implement optimizations to reduce memory consumption.

- High network latency can degrade performance for real-time applications like SRS, as timely communication between components is critical.

#### How it affects the system:
- Increased latency between containers (e.g., `srscu` and `srsdu`) can cause delays in handling radio interface data, leading to poor network performance or even service interruptions.
- In the context of SRS, high latency can disrupt the scheduling of resources, causing inefficiencies in the overall system.

#### Suggested mitigation strategies:
- Optimize the network configuration (e.g., use `--network=host` mode for low-latency communication between containers).
- Use high-performance networking tools like `tc` to prioritize critical traffic and minimize latency.
- Ensure that the underlying infrastructure (e.g., physical NICs, switches) is configured for optimal performance.
